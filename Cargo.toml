[package]
name = "nscheme"
version = "0.1.0"
edition = "2024"
description = "An R7RS Scheme interpreter written in Rust (R7RS-small core plus R7RS-large libraries)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "nscheme"
path = "src/lib.rs"

[[bin]]
name = "nscheme"
path = "src/main.rs"

[dependencies]
thiserror = "2"
rustyline = "14"
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint"] }
num-traits = "0.2"
num-integer = "0.1"
ryu = "1"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic exceptions:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
