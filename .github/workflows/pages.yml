# Build the browser version of nscheme and publish web/www to GitHub Pages
# (bead nscheme-yd0.1, ADR 0012). The built .wasm/.js are never committed;
# this job builds them from source on every push to main that could change
# them.
#
# One-time setup: Pages must be enabled with GitHub Actions as its source
# (Settings > Pages > Source: GitHub Actions, or
# `gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow`),
# or the deploy job fails. The custom domain (nscheme.degel.com, a CNAME to
# deg.github.io) is set in the same settings, not by a CNAME file: a
# workflow-built site ignores one.
name: Browser demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "lib/**"
      - "web/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# The build job compiles third-party crates, so it gets read access only;
# the deploy job alone may publish.
permissions:
  contents: read

# Queue deploys rather than cancelling one partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install the wasm-bindgen CLI pinned in web/Cargo.toml
        run: |
          version="$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' web/Cargo.toml)"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build
        run: web/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke-test the wasm
        run: node web/smoke.mjs
      # The runner image ships Google Chrome; this drives the real page
      # (Worker, streaming, Stop, crash recovery) before it is deployed.
      - name: Test the page in headless Chrome
        run: node web/browser-test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
